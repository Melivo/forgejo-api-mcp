[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgejo-api-mcp"
version = "0.1.0"
description = "A spec-driven MCP server for the Forgejo REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.0.0",
    "SecretStorage>=3.5,<4; sys_platform == 'linux'",
]

[project.scripts]
forgejo-api-mcp = "forgejo_api_mcp.server:main"
forgejo-api-mcp-launch = "forgejo_api_mcp.launcher:main"
forgejo-api-mcp-quarantine = "forgejo_api_mcp.quarantine:main"
forgejo-api-mcp-rotate = "forgejo_api_mcp.rotate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgejo_api_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".opencode"]
